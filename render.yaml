services:
  - type: web
    name: sultane-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript/tsx needed to build and migrate.
    buildCommand: npm ci --include=dev --prefix database && npm ci --include=dev --prefix backend && npm run build --prefix backend
    # bootstrap applies the schema and seeds sample data only when the database is empty.
    startCommand: npm run bootstrap --prefix database && npm run start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hashirch.github.io
      - key: SEED_ADMIN_EMAIL
        value: owner@sultane.pk
      # Owner dashboard password — read it in Render → sultane-api → Environment.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production
